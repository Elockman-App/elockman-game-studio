services:
  - type: web
    name: elockman-game-studio
    runtime: static
    repo: https://github.com/Elockman-App/elockman-game-studio
    branch: main
    buildCommand: "echo 'Static site: no external dependencies'"
    staticPublishPath: ./public
    autoDeployTrigger: commit
    domains:
      - elockmangames.com
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cache-Control
        value: no-cache
