services:
  - type: web
    name: elockman-game-studio
    runtime: static
    repo: https://github.com/Elockman-App/elockman-game-studio
    branch: main
    buildCommand: "echo 'Static site: no external dependencies'"
    staticPublishPath: ./public
    autoDeployTrigger: commit
    domains:
      - elockmangames.com
    routes:
      # Game 1: Garaj Efsanesi
      - type: redirect
        source: /play/garaj-efsanesi
        destination: https://garaj-efsanesi.onrender.com/
      - type: redirect
        source: /play/garaj-efsanesi/*
        destination: https://garaj-efsanesi.onrender.com/
      - type: redirect
        source: /play/garaj
        destination: https://garaj-efsanesi.onrender.com/
      - type: redirect
        source: /play/garaj/*
        destination: https://garaj-efsanesi.onrender.com/
      - type: redirect
        source: /oyna/garaj
        destination: https://garaj-efsanesi.onrender.com/

      # Game 2: Kulüp Efsanesi
      - type: redirect
        source: /play/kulup-efsanesi
        destination: https://kulup-efsanesi.onrender.com/
      - type: redirect
        source: /play/kulup-efsanesi/*
        destination: https://kulup-efsanesi.onrender.com/
      - type: redirect
        source: /play/kulup
        destination: https://kulup-efsanesi.onrender.com/
      - type: redirect
        source: /play/kulup/*
        destination: https://kulup-efsanesi.onrender.com/
      - type: redirect
        source: /oyna/kulup
        destination: https://kulup-efsanesi.onrender.com/

      # Game 3: Orbit Escape
      - type: redirect
        source: /play/orbit-escape
        destination: https://orbit-escape-cprs.onrender.com/
      - type: redirect
        source: /play/orbit-escape/*
        destination: https://orbit-escape-cprs.onrender.com/
      - type: redirect
        source: /play/orbit
        destination: https://orbit-escape-cprs.onrender.com/
      - type: redirect
        source: /play/orbit/*
        destination: https://orbit-escape-cprs.onrender.com/
      - type: redirect
        source: /oyna/orbit
        destination: https://orbit-escape-cprs.onrender.com/

      # Game 4: Ring Tycoon
      - type: redirect
        source: /play/ring-tycoon
        destination: https://ring-tycoon.onrender.com/
      - type: redirect
        source: /play/ring-tycoon/*
        destination: https://ring-tycoon.onrender.com/
      - type: redirect
        source: /play/ring
        destination: https://ring-tycoon.onrender.com/
      - type: redirect
        source: /play/ring/*
        destination: https://ring-tycoon.onrender.com/
      - type: redirect
        source: /oyna/ring
        destination: https://ring-tycoon.onrender.com/

      # Game 5: Hipodrom Ahırı
      - type: redirect
        source: /play/hipodrom-ahiri
        destination: https://hipodrom-ahiri.onrender.com/
      - type: redirect
        source: /play/hipodrom-ahiri/*
        destination: https://hipodrom-ahiri.onrender.com/
      - type: redirect
        source: /play/hipodrom
        destination: https://hipodrom-ahiri.onrender.com/
      - type: redirect
        source: /play/hipodrom/*
        destination: https://hipodrom-ahiri.onrender.com/
      - type: redirect
        source: /oyna/hipodrom
        destination: https://hipodrom-ahiri.onrender.com/
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob:; connect-src 'self' https:; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: "0"
