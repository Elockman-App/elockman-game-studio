services:
  - type: web
    name: elockman-game-studio
    runtime: static
    repo: https://github.com/Elockman-App/elockman-game-studio
    branch: main
    buildCommand: "echo 'Static site: no external dependencies'"
    staticPublishPath: ./public
    autoDeployTrigger: commit
    domains:
      - elockmangames.com
    routes:
      # Game 1: Garaj Efsanesi
      - type: redirect
        source: /play/garaj-efsanesi
        destination: https://elockmangames.com/games/garaj-efsanesi/
      - type: redirect
        source: /play/garaj-efsanesi/*
        destination: https://elockmangames.com/games/garaj-efsanesi/
      - type: redirect
        source: /play/garaj
        destination: https://elockmangames.com/games/garaj-efsanesi/
      - type: redirect
        source: /play/garaj/*
        destination: https://elockmangames.com/games/garaj-efsanesi/
      - type: redirect
        source: /oyna/garaj
        destination: https://elockmangames.com/games/garaj-efsanesi/

      # Game 2: Kulüp Efsanesi
      - type: redirect
        source: /play/kulup-efsanesi
        destination: https://elockmangames.com/games/kulup-efsanesi/
      - type: redirect
        source: /play/kulup-efsanesi/*
        destination: https://elockmangames.com/games/kulup-efsanesi/
      - type: redirect
        source: /play/kulup
        destination: https://elockmangames.com/games/kulup-efsanesi/
      - type: redirect
        source: /play/kulup/*
        destination: https://elockmangames.com/games/kulup-efsanesi/
      - type: redirect
        source: /oyna/kulup
        destination: https://elockmangames.com/games/kulup-efsanesi/

      # Game 3: Orbit Escape
      - type: redirect
        source: /play/orbit-escape
        destination: https://elockmangames.com/games/orbit-escape/
      - type: redirect
        source: /play/orbit-escape/*
        destination: https://elockmangames.com/games/orbit-escape/
      - type: redirect
        source: /play/orbit
        destination: https://elockmangames.com/games/orbit-escape/
      - type: redirect
        source: /play/orbit/*
        destination: https://elockmangames.com/games/orbit-escape/
      - type: redirect
        source: /oyna/orbit
        destination: https://elockmangames.com/games/orbit-escape/

      # Game 4: Ring Tycoon
      - type: redirect
        source: /play/ring-tycoon
        destination: https://elockmangames.com/games/ring-tycoon/
      - type: redirect
        source: /play/ring-tycoon/*
        destination: https://elockmangames.com/games/ring-tycoon/
      - type: redirect
        source: /play/ring
        destination: https://elockmangames.com/games/ring-tycoon/
      - type: redirect
        source: /play/ring/*
        destination: https://elockmangames.com/games/ring-tycoon/
      - type: redirect
        source: /oyna/ring
        destination: https://elockmangames.com/games/ring-tycoon/

      # Game 5: Hipodrom Ahırı
      - type: redirect
        source: /play/hipodrom-ahiri
        destination: https://elockmangames.com/games/hipodrom-ahiri/
      - type: redirect
        source: /play/hipodrom-ahiri/*
        destination: https://elockmangames.com/games/hipodrom-ahiri/
      - type: redirect
        source: /play/hipodrom
        destination: https://elockmangames.com/games/hipodrom-ahiri/
      - type: redirect
        source: /play/hipodrom/*
        destination: https://elockmangames.com/games/hipodrom-ahiri/
      - type: redirect
        source: /oyna/hipodrom
        destination: https://elockmangames.com/games/hipodrom-ahiri/
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
