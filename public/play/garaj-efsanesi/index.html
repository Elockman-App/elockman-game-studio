<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Garaj Efsanesi: Sokak Yarışı — Web Oyunu | Elockman Game Studio</title>
  <meta name="description" content="Garaj Efsanesi: Sokak Yarışı web tarayıcı sürümünü ücretsiz oyna. Sokak Yarışı & Modifiye Simülasyonu — Elockman Game Studio.">
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" type="image/svg+xml" href="/VARLIKLAR/logo/elockman-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #080a0f;
      color: #f1f3f7;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .player-header {
      height: 54px;
      background: rgba(13, 16, 24, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
      position: relative;
    }
    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #d4af37;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateX(-2px);
    }
    .game-badge {
      display: flex;
      flex-direction: column;
    }
    .game-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-genre {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.55);
    }
    .player-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f3f7;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .action-btn--primary {
      background: #ff6b35;
      color: #000;
      border-color: #ff6b35;
    }
    .action-btn--primary:hover {
      filter: brightness(1.15);
      color: #000;
    }
    .frame-container {
      width: 100%;
      height: calc(100% - 54px);
      position: relative;
      background: #000;
    }
    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #080a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .loading-overlay.hidden {
      opacity: 0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
    }
    @media (max-width: 640px) {
      .game-genre { display: none; }
      .action-text { display: none; }
      .player-header { padding: 0 10px; }
      .back-text { display: none; }
    }
  </style>
</head>
<body>
  <header class="player-header">
    <div class="player-left">
      <a href="/" class="back-btn" title="Elockman Games Ana Sayfa">
        <span>◀</span>
        <span class="back-text">Ana Sayfa</span>
      </a>
      <div class="game-badge">
        <h1 class="game-name">Garaj Efsanesi: Sokak Yarışı</h1>
        <span class="game-genre">Sokak Yarışı & Modifiye Simülasyonu</span>
      </div>
    </div>
    <div class="player-actions">
      <button class="action-btn" id="fullscreenBtn" title="Tam Ekran Yap">
        <span>⛶</span>
        <span class="action-text">Tam Ekran</span>
      </button>
      <a class="action-btn" href="https://garaj-efsanesi.onrender.com/" target="_blank" rel="noopener noreferrer" title="Ayrı Pencerede Başlat">
        <span>↗</span>
        <span class="action-text">Ayrı Pencere</span>
      </a>
      <a class="action-btn action-btn--primary" href="https://play.google.com/store/apps/details?id=com.elockman.garajefsanesi" target="_blank" rel="noopener noreferrer" title="Google Play'de İncele">
        <span>📱</span>
        <span class="action-text">Android</span>
      </a>
    </div>
  </header>

  <main class="frame-container" id="frameContainer">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p class="loading-text">Garaj Efsanesi: Sokak Yarışı yükleniyor...</p>
    </div>
    <iframe
      id="gameIframe"
      class="game-frame"
      src="https://garaj-efsanesi.onrender.com/"
      title="Garaj Efsanesi: Sokak Yarışı"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>
  </main>

  <script>
    const iframe = document.getElementById('gameIframe');
    const overlay = document.getElementById('loadingOverlay');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const container = document.getElementById('frameContainer');

    iframe.addEventListener('load', () => {
      setTimeout(() => overlay.classList.add('hidden'), 400);
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        (container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen).call(container);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
      }
    });
  </script>
</body>
</html>
