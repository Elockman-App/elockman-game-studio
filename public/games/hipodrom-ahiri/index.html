<style>
/* Layout & Night Meeting Theme */
:root{
  --bg:#09101d; --panel:linear-gradient(180deg,#17263d 0%,#0f1929 100%);
  --panel2:linear-gradient(180deg,#223755 0%,#162438 100%); --line:rgba(72,105,155,0.45);
  --fg:#f1f4f9; --muted:#94a5c0; --gold:#e8b54a; --gold-ink:#1a1405;
  --red:#f87171; --green:#34d399; --amber:#fbbf24; --blue:#3b82f6;
  --display:'HA Display','Alfa Slab One', Rockwell, Georgia, serif;
  --body:'HA Body','Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --num:'HA Num','Barlow Condensed','HA Body','Barlow', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 0%,#162640 0%,#080e1a 100%) fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{box-sizing:border-box}
html[lang="ar"] .meta,html[lang="ar"] .sub,html[lang="ar"] .riza-speech,html[lang="ar"] .set-row span{direction:rtl;text-align:right}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.app{max-width:580px;margin:0 auto;padding-inline:14px;padding-block:0 100px;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(9,16,29,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1.5px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.3);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:18px;color:var(--gold);flex:1;min-width:0;white-space:nowrap;letter-spacing:.3px;display:flex;align-items:center;text-shadow:0 2px 8px rgba(232,181,74,.35)}
.chip{font-family:var(--num);font-weight:700;font-size:16px;background:linear-gradient(180deg,#1c2d47 0%,#131e30 100%);border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.chip.neg{color:var(--red)}
.chip.gold{color:var(--gold);border-color:rgba(232,181,74,.5);box-shadow:0 0 10px rgba(232,181,74,.2),inset 0 1px 0 rgba(255,255,255,.15)}
.btn{background:var(--panel2);border:1px solid rgba(255,255,255,.16);border-bottom:3px solid rgba(0,0,0,.45);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .1s;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.gold{background:linear-gradient(180deg,#ffd868 0%,#d89f2a 100%);color:#1b1202;border-color:#ffe685;border-bottom:3px solid #8e630e;box-shadow:0 4px 14px rgba(232,181,74,.45)}
.btn.green{background:linear-gradient(180deg,#2f855a 0%,#1c5338 100%);color:#d1fae5;border-color:#48bb78;border-bottom:3px solid #0f2e1f}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.red{color:var(--red);border-color:rgba(248,113,113,.3)}
.btn.icon{padding:7px;border-radius:8px}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:16px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 12px;font-size:13.5px}
.list{display:grid;gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:15px;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);transition:border-color .2s,transform .15s}
.hrow{display:flex;align-items:center;gap:12px}
.hname{font-weight:700;font-size:18px;line-height:1.2}
.meta{color:var(--muted);font-size:13px}
.link{color:var(--gold);font-size:12px;font-weight:600;text-decoration:underline;padding:0 0 0 6px;vertical-align:middle}
.stars{color:var(--gold);letter-spacing:1px}
.rn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rn input{flex:1;min-width:120px;font:inherit;font-weight:700;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--gold);border-radius:8px;padding:6px 8px}
.rating{margin-left:auto;text-align:center;font-family:var(--num);font-weight:700;background:linear-gradient(180deg,#253754 0%,#15233a 100%);border:1.5px solid rgba(232,181,74,.45);border-radius:12px;padding:5px 11px;min-width:58px;flex:none;box-shadow:0 3px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.rating b{display:block;font-size:25px;color:var(--gold);line-height:1;text-shadow:0 2px 8px rgba(232,181,74,.4)}
.rating span{font-size:10px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 9px;align-items:center;margin-block:11px;font-size:13px}
.bar{height:10px;background:rgba(8,14,24,.85);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8b54a,#ffdf88);border-radius:5px;box-shadow:0 0 6px rgba(232,181,74,.5)}
.bar i.c{background:linear-gradient(90deg,#34d399,#10b981);box-shadow:0 0 6px rgba(16,185,129,.5)}
.bar i.c.low{background:linear-gradient(90deg,#fbbf24,#f59e0b);box-shadow:0 0 6px rgba(245,158,11,.4)}
.bar i.c.vlow{background:linear-gradient(90deg,#f87171,#ef4444);box-shadow:0 0 6px rgba(239,68,68,.4)}
.num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--panel2);color:var(--muted)}
.tag.kum{background:#4a3a25;color:#f0d6a8}
.tag.cim{background:#24452c;color:#b6e6b9}
.tag.yagmur{background:#1d3247;color:#89bdf0}
.tag.gece{background:#151d30;color:#f0c674}
.tag.gunes{background:#382f18;color:#f5d77f}
.tag.done{background:#3a2d16;color:var(--gold)}
.tag.gold{background:rgba(232,181,74,.2);color:var(--gold);border:1px solid rgba(232,181,74,.3)}
.cnum{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;flex:none;border:1px solid rgba(255,255,255,.25)}
.ann{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.ann.mine{border-color:var(--gold)}
.ann .pt{width:52px;height:52px}
.sdot{display:inline-block;width:20px;height:11px;border-radius:3px;vertical-align:middle;border:1px solid rgba(255,255,255,.35)}
.pt{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;border:2px solid var(--line);background:var(--panel2)}
.bicon{width:28px;height:28px;border-radius:7px;vertical-align:middle;margin-right:7px;object-fit:cover}
.splash{position:fixed;inset:0;z-index:30;background:#1a1006 url(img/splash.webp) center/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 36px) 24px calc(env(safe-area-inset-bottom,0px) + 32px)}
.sp-title{font-family:var(--display);color:#fff;text-align:center;line-height:.95;text-shadow:0 3px 18px rgba(0,0,0,.55),0 1px 0 rgba(0,0,0,.4)}
.sp-title span{display:block;font-size:clamp(42px,12vw,70px)}
.sp-title span+span{color:var(--gold)}
.sp-bottom{display:grid;gap:10px;justify-items:center}
/* Elockman Game Studio açılışı: siyah → logo belirir → bekler → kararır → oyun */
.studio{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s ease;overflow:hidden}
.studio video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.studio.out{opacity:0;pointer-events:none;transition:opacity .45s ease}
.studio.gone{display:none!important}
.sp-lang{display:flex;gap:4px;background:rgba(0,0,0,.45);border-radius:999px;padding:3px}
.sp-lang button{border:0;background:none;color:#fff;font:600 13px var(--num,system-ui);padding:5px 12px;border-radius:999px;cursor:pointer}
.sp-lang button.on{background:var(--gold);color:var(--gold-ink)}
.sp-btn{font-family:var(--display);font-weight:400;font-size:24px;padding:14px 56px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.sp-sub{color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8);font-family:var(--num);font-size:16px}
.silk{width:34px;height:34px;border-radius:8px;flex:none;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.15)}
.race-card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.race-card .cls{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.race-card .rname{font-weight:700;font-size:17px}
.purse{text-align:right;font-family:var(--num);font-weight:700;font-size:20px;color:var(--fg)}
.purse small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pick{display:grid;gap:8px;margin-top:10px;grid-column:1/-1}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:linear-gradient(180deg,rgba(16,26,44,0.95) 0%,rgba(9,15,26,0.98) 100%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1.5px solid rgba(72,105,155,0.45);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 20px rgba(0,0,0,.45)}
.tabs button{flex:1;max-width:none;padding:6px 1px 8px;font-weight:700;font-size:10px;color:var(--muted);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.tabs button .ti{font-size:18px;line-height:1;transition:transform .15s}
.tabs button[aria-current="true"]{color:var(--gold);border-top-color:var(--gold);background:linear-gradient(180deg,rgba(232,181,74,.14) 0%,transparent 100%)}
.tabs button[aria-current="true"] .ti{transform:scale(1.15);filter:drop-shadow(0 2px 6px rgba(232,181,74,.55))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:10px;z-index:25;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:opacity .25s;pointer-events:none}
.help{background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px}
.help b{color:var(--gold)}
.help ul{margin:6px 0 0;padding-left:18px}
/* race */
.race-full{position:fixed;inset:0;z-index:15;background:#0b1220;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.race-full > canvas#cv, .race-full > canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.r-hud{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));width:min(240px,36vw);background:rgba(15,24,41,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:5px 9px}
.r-hud .hrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.r-hud .lbl{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-hud b{font-family:var(--num);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.r-hud .elbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.r-hud .elbl b{font-size:15px}
.r-hud .ebar{margin-top:3px;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.r-hud .ebar i{display:block;height:100%;background:var(--green);transition:width .1s linear}
.race-full .comm{position:absolute;left:50%;transform:translateX(-50%);top:calc(13% + 6px);width:min(520px,58vw);margin:0;min-height:0;font-size:14px;background:rgba(15,24,41,.86);padding:6px 12px;border-left:4px solid var(--gold);border-radius:6px;font-weight:600}
.btn.muted{opacity:.4}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.66);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:min(860px,100%);max-height:100%;overflow:auto;padding:0 16px 18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:1}
.sheet-head h2{margin:0}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.set-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.set-card h3{margin:0 0 2px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.set-card .meta{margin:0}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set-row small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.rg{display:flex;align-items:center;gap:8px}
.rg input{width:min(160px,36vw);accent-color:var(--gold)}
.rg output{min-width:28px;text-align:right;font-family:var(--num);font-weight:700}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;margin:0;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw:checked{background:var(--gold);border-color:var(--gold)}
.sw:checked::after{transform:translateX(18px);background:var(--gold-ink)}
